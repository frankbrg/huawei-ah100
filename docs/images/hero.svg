<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Huawei AH100 for Home Assistant</title>
  <desc id="desc">A local Bluetooth scale integration with synthetic example readings for weight, body fat, impedance, and time.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fbff"/>
      <stop offset="1" stop-color="#eaf6f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20d0c4"/>
      <stop offset="1" stop-color="#37a9e7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#12304a" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1000" height="360" rx="28" fill="url(#background)"/>
  <circle cx="486" cy="36" r="182" fill="#d9f4f1" opacity=".42"/>
  <circle cx="5" cy="357" r="188" fill="#d8eef8" opacity=".52"/>

  <g transform="translate(58 52)">
    <rect width="46" height="46" rx="14" fill="#10233f"/>
    <rect x="12" y="10" width="22" height="26" rx="6" fill="#f4fbff"/>
    <rect x="17" y="15" width="12" height="6" rx="2" fill="url(#accent)"/>
    <path d="M16 28c2.7-3 11.3-3 14 0" fill="none" stroke="#10233f" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="118" y="80" fill="#436078" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">HOME ASSISTANT · BLUETOOTH</text>

  <text x="60" y="150" fill="#10233f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="750">Huawei AH100</text>
  <text x="60" y="191" fill="#10233f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="600">Scale data, right at home.</text>
  <text x="60" y="232" fill="#506b7c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">A local integration for direct readings in</text>
  <text x="60" y="257" fill="#506b7c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Home Assistant — no MQTT or companion service.</text>
  <rect x="60" y="285" width="314" height="34" rx="17" fill="#d7efee"/>
  <circle cx="79" cy="302" r="5" fill="#16a99d"/>
  <text x="94" y="307" fill="#176d73" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing=".6">LOCAL BLUETOOTH · NO CLOUD</text>

  <rect x="527" y="38" width="421" height="284" rx="24" fill="#ffffff" opacity=".58"/>
  <rect x="548" y="52" width="379" height="30" rx="15" fill="#e6f5f5"/>
  <text x="737.5" y="72" text-anchor="middle" fill="#177e80" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">ILLUSTRATIVE VALUES ONLY</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="548" y="98" width="180" height="96" rx="17" fill="#ffffff"/>
    <rect x="744" y="98" width="183" height="96" rx="17" fill="#ffffff"/>
    <rect x="548" y="210" width="180" height="96" rx="17" fill="#ffffff"/>
    <rect x="744" y="210" width="183" height="96" rx="17" fill="#ffffff"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="570" cy="122" r="5" fill="#21bcb2"/>
    <text x="583" y="127" fill="#60798a" font-size="13" font-weight="600">WEIGHT</text>
    <text x="567" y="169" fill="#10233f" font-size="29" font-weight="700">70.0 <tspan font-size="16" font-weight="600">kg</tspan></text>

    <circle cx="766" cy="122" r="5" fill="#408fdd"/>
    <text x="779" y="127" fill="#60798a" font-size="13" font-weight="600">BODY FAT</text>
    <text x="763" y="169" fill="#10233f" font-size="29" font-weight="700">20.0<tspan font-size="17">%</tspan></text>

    <circle cx="570" cy="234" r="5" fill="#21bcb2"/>
    <text x="583" y="239" fill="#60798a" font-size="13" font-weight="600">IMPEDANCE</text>
    <text x="567" y="281" fill="#10233f" font-size="29" font-weight="700">450 <tspan font-size="16" font-weight="600">Ω</tspan></text>

    <circle cx="766" cy="234" r="5" fill="#408fdd"/>
    <text x="779" y="239" fill="#60798a" font-size="13" font-weight="600">LAST MEASUREMENT</text>
    <text x="763" y="268" fill="#10233f" font-size="18" font-weight="700">2026-01-01</text>
    <text x="763" y="289" fill="#60798a" font-size="14" font-weight="600">08:15 UTC</text>
  </g>
</svg>
